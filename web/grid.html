<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>WebRTC ROS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      text-wrap: balance;
      overflow-wrap: break-word;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 2em;
    }

    h1 {
      font-size: 1.6em;
    }

    h2 {
      font-size: 1em;
      font-weight: normal;
      color: light-dark(#464646, #c0c0c0);
    }

    ul {
      padding: 0.5em 1.5em;
    }

    #status {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 1em;
    }

    a {
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    video {
      background: #000;
      border-radius: 4px;
      min-width: min(80dvw, 640px);
      max-height: 50dvh;
      aspect-ratio: 16 / 9;
    }
  </style>

</head>

<body>
  <h1>WebRTC ROS</h1>

  <h3 id="status">Streams</h3>
  <a href="chrome://webrtc-internals" target="_blank" id="webrtc-analytics">Open webrtc-internals (Click to copy
    URL)</a>

  <div id="videos" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px"></div>

  <script>
    const MY_ID = "browser-" + Math.random().toString(36).substr(2, 8);
    const REMOTE_ID = "uav999";
    const STREAMS = []; // ["/oak/stereo/image_raw"];

    document.getElementById("status").textContent = "Connecting to signaling server...";
    document.getElementById("webrtc-analytics").onclick = (e) => {
      e.preventDefault();
      navigator.clipboard.writeText("chrome://webrtc-internals").then(() => {
        alert("URL copied to clipboard! Paste it in the browser address bar to analyze the connection.");
      }).catch(err => {
        alert("Failed to copy URL: " + err);
      });
    };

    let ws, pc;
    ws = new WebSocket(`ws://localhost:8000/${MY_ID}`);
    pc = new RTCPeerConnection({ bundlePolicy: "max-bundle" });

    // Create <video> elements for each incoming track and handle autoplay
    pc.ontrack = (evt) => {
      const wrapper = document.createElement("div");
      wrapper.style = "text-align:center";
      wrapper.innerHTML = `<p><b>${evt.track.label || "stream"}</b></p>`;

      const video = document.createElement("video");
      video.autoplay = video.muted = video.playsInline = true;

      video.srcObject = new MediaStream([evt.track]);

      wrapper.appendChild(video);
      document.getElementById("videos").appendChild(wrapper);
    };

    pc.onicecandidate = (evt) => {
      if (evt.candidate)
        ws.send(JSON.stringify({
          id: REMOTE_ID, type: "candidate",
          candidate: evt.candidate.candidate,
          sdpMid: evt.candidate.sdpMid,
          sdpMLineIndex: evt.candidate.sdpMLineIndex.toString()
        }));
    };

    ws.onopen = () => {
      ws.send(JSON.stringify({
        id: REMOTE_ID,
        type: "request",
        streams: STREAMS,
      }));
      document.getElementById("status").textContent = "✅ Connected to signaling server";
    };

    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "error") {
        document.getElementById("status").textContent = "Error: " + msg.reason;
        return;
      }
      if (msg.type === "offer") {
        await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ id: REMOTE_ID, type: "answer", sdp: answer.sdp }));
      } else if (msg.type === "candidate") {
        await pc.addIceCandidate({ 
          candidate: msg.candidate, 
          sdpMid: msg.sdpMid, 
          sdpMLineIndex: parseInt(msg.sdpMLineIndex) 
        });
      }
    };

    ws.onclose = () => {
      document.getElementById("status").textContent = "❌ Disconnected from signaling server";
    };
  </script>
</body>

</html>
