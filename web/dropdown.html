<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>WebRTC ROS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      text-wrap: balance;
      overflow-wrap: break-word;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 2em;
    }

    h1 {
      font-size: 1.6em;
    }

    h2 {
      font-size: 1em;
      font-weight: normal;
      color: light-dark(#464646, #c0c0c0);
    }

    ul {
      padding: 0.5em 1.5em;
    }

    #status {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 1em;
    }

    a {
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    video {
      background: #000;
      border-radius: 4px;
      min-width: min(80dvw, 640px);
      max-height: 50dvh;
      aspect-ratio: 16 / 9;
    }

    select {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      padding: 0.5em;
      background: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 4px;
    }
  </style>

</head>

<body>
  <h1>WebRTC ROS</h1>

  <h3 id="status">Connecting to signaling server...</h3>

  <a href="chrome://webrtc-internals" target="_blank" id="webrtc-analytics">Open webrtc-internals (Click to copy
    URL)</a>

  <div id="videos" style="position: relative; ">
    <select id="stream-select">
      <option value="" disabled selected>Select a stream</option>
    </select>

    <video autoplay muted playsinline id="remote-video"></video>

  </div>

  <script>
    const MY_ID = "browser";
    const REMOTE_ID = "uav999";
    const STREAMS = []; // ["/oak/stereo/image_raw"];

    const select = document.getElementById("stream-select");
    const video = document.getElementById("remote-video");
    document.getElementById("webrtc-analytics").onclick = (e) => {
      e.preventDefault();
      navigator.clipboard.writeText("chrome://webrtc-internals").then(() => {
        alert("URL copied to clipboard! Paste it in the browser address bar to analyze the connection.");
      }).catch(err => {
        alert("Failed to copy URL: " + err);
      });
    };

    let availableStreams = [];

    select.addEventListener("change", () => {
      const track = availableStreams[select.value];
      if (track) {
        const stream = new MediaStream([track]);
        video.srcObject = stream;
      }
    });

    let ws, pc;
    ws = new WebSocket(`ws://localhost:8000/${MY_ID}`);
    pc = new RTCPeerConnection({ bundlePolicy: "max-bundle" });

    pc.ontrack = (evt) => {
      console.log("Received track:", evt.track);
      availableStreams.push(evt.track);
      const option = document.createElement("option");
      option.value = availableStreams.length - 1;
      option.textContent = evt.track.label || `Stream ${availableStreams.length}`;
      select.appendChild(option);
    };

    pc.onicecandidate = (evt) => {
      if (evt.candidate)
        ws.send(JSON.stringify({
          id: REMOTE_ID, type: "candidate",
          candidate: evt.candidate.candidate,
          sdpMid: evt.candidate.sdpMid,
          sdpMLineIndex: evt.candidate.sdpMLineIndex.toString()
        }));
    };

    ws.onopen = () => {
      ws.send(JSON.stringify({
        id: REMOTE_ID,
        type: "request",
        streams: STREAMS,
      }));
      document.getElementById("status").textContent = "✅ Connected to signaling server";
    };

    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "error") {
        document.getElementById("status").textContent = "Error: " + msg.reason;
        return;
      }
      if (msg.type === "offer") {
        await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ id: REMOTE_ID, type: "answer", sdp: answer.sdp }));
      } else if (msg.type === "candidate") {
        await pc.addIceCandidate({ 
          candidate: msg.candidate, 
          sdpMid: msg.sdpMid, 
          sdpMLineIndex: parseInt(msg.sdpMLineIndex) 
        });
      }
    };

    ws.onclose = () => {
      document.getElementById("status").textContent = "❌ Disconnected from signaling server";
    };
  </script>
</body>

</html>
