<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>WebRTC ROS - Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      text-wrap: balance;
      overflow-wrap: break-word;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 2em;
    }

    h1 {
      font-size: 1.6em;
    }

    h2 {
      font-size: 1em;
      font-weight: normal;
      color: light-dark(#464646, #c0c0c0);
    }

    video {
      width: 100%;
      max-width: min(1000px, 100%);
      height: auto;
      background: #000;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      display: block;
      margin: 1em 0;
    }

    a {
      text-decoration: none;
      color: #007bff;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>


</head>

<body>
  <h1>WebRTC ROS - Viewer</h1>
  <h2 id="topic"></h2>
  <video id="remote-video" autoplay="true" muted="true"></video>
  <p><a href="/">Back to topic list</a></p>

  <script src="adapter.js" defer></script>
  <script src="webrtc_ros.js" defer></script>
  <script src="viewer.js" defer></script>
</body>

</html>
